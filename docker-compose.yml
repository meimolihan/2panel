services:
  app:
    image: mobufan/2panel
    container_name: ${CONTAINER_NAME:-2panel}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-v1.0.9}
        BUILD: ${BUILD:-0}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s