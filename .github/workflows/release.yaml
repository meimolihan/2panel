name: Release

on:
  workflow_dispatch:
  push:
    tags:
    - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish Binaries
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check Tag
      id: check-tag
      shell: bash
      run: |
        ver=${GITHUB_REF##*/}
        echo "version=$ver" >> $GITHUB_OUTPUT

    - name: Verify main.go version matches tag
      shell: bash
      run: |
        ver=${GITHUB_REF##*/}
        want=${ver#v}
        got=$(grep -E '^\s*version\s*=\s*"' main.go | head -1 | sed -E 's/.*"v([0-9][^"]*)".*/\1/')
        echo "tag version=${want}, main.go version=${got}"
        if [[ "$got" != "$want" ]]; then
          echo "ERROR: main.go version (v${got}) does not match tag (${ver}). Run scripts/build-and-push.sh to release." >&2
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build binaries
      shell: bash
      run: |
        set -euxo pipefail
        BUILD="$(date -u +%Y%m%d%H%M%S)"
        LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME} -X main.build=${BUILD} -X main.buildTime=${BUILD}"
        mkdir -p dist
        for spec in "linux amd64" "linux arm64"; do
          set -- $spec
          os=$1; arch=$2
          name=2panel_${os}_${arch}
          CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags "${LDFLAGS}" -o "dist/${name}" .
          (cd dist && sha256sum "${name}" > "${name}.sha256")
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/2panel_linux_amd64
          dist/2panel_linux_amd64.sha256
          dist/2panel_linux_arm64
          dist/2panel_linux_arm64.sha256
        body_path: RELEASE_NOTES.md
        generate_release_notes: true

  docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'mobufan' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD=${{ github.run_id }}
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: mobufan/2panel:latest, mobufan/2panel:${{ github.ref_name }}